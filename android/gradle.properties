# 内存参数与本机 RAM（15GB，桌面环境常驻占用 ~8GB）匹配；-Xmx8G 曾导致 swap 抖动、构建假死半小时。
# 与 ~/.gradle/gradle.properties 保持一致（项目级覆盖用户级，故此处必须显式写小值）。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 构建加速（对本项目安全，单模块 + 插件无配置缓存冲突）
org.gradle.parallel=true
org.gradle.caching=true
