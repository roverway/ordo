name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APKs (Split per ABI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation & Localization
        run: |
          dart run build_runner build --force-jit
          flutter gen-l10n

      - name: Build Android APKs
        run: flutter build apk --split-per-abi --release

      - name: Prepare Android artifacts
        run: |
          mkdir -p dist-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist-android/ordo-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist-android/ordo-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist-android/ordo-android-x86_64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ordo-android-apks
          path: dist-android/*.apk

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation & Localization
        run: |
          dart run build_runner build --force-jit
          flutter gen-l10n

      - name: Build Linux binary
        run: flutter build linux --release

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp linux/runner/ordo.desktop AppDir/
          cp linux/runner/ordo.png AppDir/
          cp linux/runner/ordo.png AppDir/usr/share/icons/hicolor/256x256/apps/ordo.png
          
          # Create AppRun script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          cd "${HERE}/usr/bin"
          exec "${HERE}/usr/bin/ordo" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download and run appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          mkdir -p dist-linux
          ARCH=x86_64 ./squashfs-root/AppRun AppDir dist-linux/ordo-linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordo-linux-appimage
          path: dist-linux/*.AppImage

  build-windows:
    name: Build Windows Application Zip
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation & Localization
        run: |
          dart run build_runner build --force-jit
          flutter gen-l10n

      - name: Build Windows binary
        run: flutter build windows --release

      - name: Zip Windows build bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist-windows\ordo-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordo-windows-zip
          path: dist-windows/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
