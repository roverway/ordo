name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation & Localization
        run: |
          dart run build_runner build --force-jit
          flutter gen-l10n

      - name: Build Android APKs
        run: |
          flutter build apk --split-per-abi --release
          flutter build apk --release

      - name: Prepare Android artifacts
        run: |
          mkdir -p dist-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist-android/ordo-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist-android/ordo-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist-android/ordo-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist-android/ordo-android-universal.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ordo-android-arm64-v8a
          path: dist-android/ordo-android-arm64-v8a.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ordo-android-armeabi-v7a
          path: dist-android/ordo-android-armeabi-v7a.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ordo-android-x86_64
          path: dist-android/ordo-android-x86_64.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ordo-android-universal
          path: dist-android/ordo-android-universal.apk

  build-linux:
    name: Build Linux AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            appimagetool_arch: x86_64
          - arch: aarch64
            os: ubuntu-24.04-arm
            appimagetool_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libsqlite3-dev file

      - name: Set up Flutter (x86_64)
        if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Flutter (aarch64 via Git)
        if: matrix.arch == 'aarch64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          $HOME/flutter/bin/flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation & Localization
        run: |
          dart run build_runner build --force-jit
          flutter gen-l10n

      - name: Build Linux binary
        run: flutter build linux --release

      - name: Package AppImage
        env:
          ARCH: ${{ matrix.arch }}
          TOOL_ARCH: ${{ matrix.appimagetool_arch }}
        run: |
          mkdir -p AppDir/lib AppDir/data

          # Locate bundle folder (matches both x64 and arm64 build paths)
          BUNDLE_DIR=$(ls -d build/linux/*/release/bundle | head -n 1)

          # Copy executable, lib, and data to AppDir root
          cp "$BUNDLE_DIR/ordo" AppDir/
          cp -r "$BUNDLE_DIR/lib/"* AppDir/lib/
          cp -r "$BUNDLE_DIR/data/"* AppDir/data/

          # Copy desktop integration assets
          cp linux/runner/ordo.desktop AppDir/
          cp linux/runner/ordo.png AppDir/
          ln -sf ordo.png AppDir/.DirIcon

          # Bundle non-standard shared libraries (libsecret, libjson-glib) so minimal distros won't fail
          find /usr/lib -name "libsecret-1.so.0*" -exec cp -d {} AppDir/lib/ \; 2>/dev/null || true
          find /usr/lib -name "libjson-glib-1.0.so.0*" -exec cp -d {} AppDir/lib/ \; 2>/dev/null || true

          # Create robust AppRun entry point
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'SELF=$(readlink -f "$0")' >> AppDir/AppRun
          echo 'HERE=${SELF%/*}' >> AppDir/AppRun
          echo 'export PATH="${HERE}:${PATH}"' >> AppDir/AppRun
          echo 'export LD_LIBRARY_PATH="${HERE}/lib:${LD_LIBRARY_PATH}"' >> AppDir/AppRun
          echo 'cd "${HERE}"' >> AppDir/AppRun
          echo 'exec "${HERE}/ordo" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun

          # Download architecture-matching appimagetool
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

          mkdir -p dist-linux
          ARCH=${ARCH} ./squashfs-root/AppRun AppDir "dist-linux/ordo-linux-${ARCH}.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordo-linux-${{ matrix.arch }}-appimage
          path: dist-linux/*.AppImage

  build-windows:
    name: Build Windows Application Zip
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation & Localization
        run: |
          dart run build_runner build --force-jit
          flutter gen-l10n

      - name: Build Windows binary
        run: flutter build windows --release

      - name: Zip Windows build bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist-windows\ordo-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordo-windows-zip
          path: dist-windows/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
